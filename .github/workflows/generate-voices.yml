# Makes the voice recordings with ElevenLabs and saves them to the project.
# Run it from GitHub: Actions tab → "Generate voices" → "Run workflow".
name: Generate voices

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: "Only this chapter (for example ch02). Leave empty for all."
        required: false
        default: ""
      dry_run:
        description: "Only count the cost, don't make anything"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make recordings
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.chapter }}" ]; then ARGS="$ARGS --only=${{ inputs.chapter }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node tools/generate-voices.mjs $ARGS
      - name: Save recordings to the project
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "voice-generator"
          git config user.email "voice-generator@users.noreply.github.com"
          git add content/audio
          git diff --cached --quiet || git commit -m "Add voice recordings"
          git push
