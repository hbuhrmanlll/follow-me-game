# Builds the 3D test version (Godot) as an Android app on GitHub's computers.
# It runs by itself when the 3D game or the content changes, or from the
# Actions tab → "3D test app" → "Run workflow". The app is published at:
# https://github.com/hbuhrmanlll/follow-me-game/releases/download/test-build-3d/follow-me-3d-test.apk
name: 3D test app

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'content/**'
      - 'tools/godot-*.sh'
      - 'tools/zip-pick.py'
      - '.github/workflows/godot.yml'
  workflow_dispatch:

permissions:
  contents: write # to publish the test app on the Releases page

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/godot-4.7-stable
            ~/.local/share/godot/export_templates
          key: godot-4.7-stable-android

      - name: Build the 3D test app (APK)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/godot-build.sh android

      # Replaces the previous 3D test app, so the download link never changes.
      - name: Publish the 3D test app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build-3d --yes --cleanup-tag || true
          gh release create test-build-3d godot/build/follow-me-3d-test.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "3D test app: build ${{ github.run_number }}" \
            --notes "The 3D test version of Chapter 1, made with the Godot engine. Download follow-me-3d-test.apk on your phone and open it to install. It installs next to the regular test app. See GODOT.md for help."
