# Publishes the web version of the game on GitHub Pages after every change:
# https://hbuhrmanlll.github.io/follow-me-game/
# The 3D test version (made with Godot) goes in the same site:
# https://hbuhrmanlll.github.io/follow-me-game/3d/
# One-time setup: Settings → Pages → Source: "GitHub Actions" (see README.md).
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/cache@v4
        with:
          path: |
            ~/godot-4.7-stable
            ~/.local/share/godot/export_templates
          key: godot-4.7-stable-web
      - name: Build the 3D test version
        run: bash tools/godot-build.sh web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
