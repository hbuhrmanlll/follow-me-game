<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1410" />
    <title>Follow Me: Walk with Jesus</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1410; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      #rotate {
        display: none; position: fixed; inset: 0; background: #1b1410; color: #f3e6c8;
        font: 600 24px/1.4 Georgia, serif; text-align: center;
        align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      }
      .fm-overlay {
        position: fixed; inset: 0; background: rgba(20, 12, 6, 0.7); z-index: 10;
        display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      }
      .fm-panel {
        background: #f3e6c8; color: #2b1d12; border: 4px solid #9c6b1f; border-radius: 20px;
        padding: 20px 28px; max-width: 760px; width: 100%; max-height: 100%; box-sizing: border-box;
        font: 24px/1.45 Georgia, serif; display: flex; flex-direction: column; gap: 14px;
      }
      .fm-panel h2 { margin: 0; font-size: 30px; }
      .fm-panel p { margin: 0; }
      .fm-row { display: flex; gap: 16px; justify-content: center; align-items: center; }
      .fm-head { justify-content: space-between; }
      .fm-btn {
        font: bold 26px Georgia, serif; color: #2b1d12; background: #d9a441; border: 3px solid #9c6b1f;
        border-radius: 16px; min-height: 64px; min-width: 120px; padding: 0 24px; cursor: pointer;
      }
      .fm-btn-secondary { background: #e9dcc0; }
      .fm-input {
        font: 32px Georgia, serif; padding: 12px 16px; border: 3px solid #9c6b1f; border-radius: 12px;
        background: #fffaf0; color: #2b1d12;
      }
      .fm-scripture { max-width: 960px; height: 100%; }
      .fm-switch { display: flex; gap: 8px; }
      .fm-switch .fm-btn { min-width: 90px; min-height: 56px; }
      .fm-passage { overflow-y: auto; flex: 1; padding-right: 8px; }
      .fm-passage p { margin-bottom: 10px; }
      .fm-passage sup { color: #9c6b1f; font-weight: bold; font-size: 16px; }
      .fm-passage small { display: block; margin-top: 12px; color: #6b5a45; font-size: 16px; }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Please turn your phone sideways ↻</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
