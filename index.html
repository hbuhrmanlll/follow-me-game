<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1410" />
    <title>Follow Me: Walk with Jesus</title>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1410; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      #rotate {
        display: none; position: fixed; inset: 0; background: #1b1410; color: #f3e6c8;
        font: 600 24px/1.4 Georgia, serif; text-align: center;
        align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      }
      .fm-overlay {
        position: fixed; inset: 0; background: rgba(20, 12, 6, 0.7); z-index: 10;
        display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      }
      .fm-panel {
        background: #f3e6c8; color: #2b1d12; border: 4px solid #9c6b1f; border-radius: 20px;
        padding: 20px 28px; max-width: 760px; width: 100%; max-height: 100%; box-sizing: border-box;
        font: 24px/1.45 Georgia, serif; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
      }
      .fm-panel h2 { margin: 0; font-size: 30px; }
      .fm-panel p { margin: 0; }
      .fm-row { display: flex; gap: 16px; justify-content: center; align-items: center; }
      .fm-head { justify-content: space-between; }
      .fm-btn {
        font: bold 26px Georgia, serif; color: #2b1d12; background: #d9a441; border: 3px solid #9c6b1f;
        border-radius: 16px; min-height: 64px; min-width: 120px; padding: 0 24px; cursor: pointer;
      }
      .fm-btn-secondary { background: #e9dcc0; }
      .fm-input {
        font: 32px Georgia, serif; padding: 12px 16px; border: 3px solid #9c6b1f; border-radius: 12px;
        background: #fffaf0; color: #2b1d12;
      }
      .fm-scripture { max-width: 960px; height: 100%; }
      .fm-switch { display: flex; gap: 8px; }
      .fm-switch .fm-btn { min-width: 90px; min-height: 56px; }
      .fm-passage { overflow-y: auto; flex: 1; padding-right: 8px; }
      .fm-passage p { margin-bottom: 10px; }
      .fm-passage sup { color: #9c6b1f; font-weight: bold; font-size: 16px; }
      .fm-passage small { display: block; margin-top: 12px; color: #6b5a45; font-size: 16px; }
      .fm-menu { max-width: 820px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .fm-menu h2 { grid-column: 1 / -1; }
      .fm-menu .fm-btn { width: 100%; text-align: left; min-height: 76px; }
      .fm-menu .fm-btn:first-of-type { grid-column: 1 / -1; }
      .fm-verse { cursor: pointer; border-bottom: 1px solid #d8c8a0; padding-bottom: 10px; }
      .fm-stars { color: #c08a1f; letter-spacing: 2px; }
      .fm-head h2 { flex: 1; }
      .fm-badge { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center;
        justify-content: center; font-size: 46px; border: 4px solid #f3e6c8; flex: none; }
      .fm-card ul { margin: 8px 0; padding-left: 28px; }
      .fm-card li { margin-bottom: 8px; }
      .fm-card sup { color: #9c6b1f; font-weight: bold; font-size: 15px; }
      .fm-more { font-style: italic; color: #6b5a45; }
      .fm-tradition { background: #e9dcc0; border-radius: 12px; padding: 10px 14px; font-size: 21px; }
      .fm-choices { display: flex; flex-direction: column; gap: 12px; }
      .fm-choices .fm-btn { text-align: left; min-height: 72px; flex: none; }
      .fm-panel > .fm-btn, .fm-row { flex: none; }
      .fm-choices small { display: block; font: 18px Georgia, serif; font-weight: normal; }
      .fm-setting { display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 10px 0; border-bottom: 1px solid #d8c8a0; flex-wrap: wrap; }
      .fm-setting label { font-weight: bold; }
      .fm-slider { width: 260px; height: 40px; accent-color: #9c6b1f; }
      .fm-settings .fm-switch .fm-btn { min-width: 80px; }
      .fm-hold { position: relative; overflow: hidden; min-width: 260px; min-height: 90px; }
      .fm-hold-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #7fb069; }
      .fm-hold span:last-child { position: relative; }
      .fm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; align-content: start; }
      .fm-grid .fm-btn { text-align: left; font-size: 20px; min-height: 64px; }
      .fm-leader { position: fixed; top: calc(100vh * 0.135); left: 8px; z-index: 5; background: #2b1d12;
        color: #ffe600; font: bold 18px Georgia, serif; padding: 4px 14px; border-radius: 10px; pointer-events: none; }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Please turn your phone sideways ↻</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
